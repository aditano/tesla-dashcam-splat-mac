[project]
name = "dashsplat"
version = "0.1.0"
description = "TeslaCam → 3D Gaussian Splat pipeline for Apple Silicon"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
]

[project.optional-dependencies]
mlx = [
  "mlx>=0.22",
  "mlx-vlm>=0.7.5",
  "huggingface-hub>=0.24",
]
train = [
  "torch>=2.3",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
dashsplat = "dashsplat.cli:main_folder_argv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dashsplat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
