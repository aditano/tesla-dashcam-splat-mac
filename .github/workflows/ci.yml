name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# One run per branch — avoid push+PR duplicates starving macos-15 runners
# (Build/Swift previously sat queued 15m with steps:[] then cancelled).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python unit + smoke
    # GitHub retired macos-14 arm64 runners (macos-14-arm64-us-default unsupported).
    # App still targets macOS 14+ via MACOSX_DEPLOYMENT_TARGET.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python3 -m pip install -U pip
          python3 -m pip install -e "python/[dev]"
      - name: Generate synthetic fixtures (temp — never overwrite tracked fixtures/)
        run: |
          SYNTH_DIR="$(mktemp -d "${TMPDIR:-/tmp}/dashsplat-synth.XXXXXX")"
          echo "SYNTH_DIR=$SYNTH_DIR" >> "$GITHUB_ENV"
          python3 python/tools/generate_synthetic_clip.py --out "$SYNTH_DIR"
          # Tracked fixtures/sample_teslacam is used as-is; do not cp over it.
      - name: Pytest
        working-directory: python
        run: |
          set +e
          python3 -m pytest -q
          code=$?
          echo "pytest_exit_code=$code"
          exit $code
      - name: CLI list smoke
        run: |
          export PYTHONPATH="$PWD/python"
          set +e
          python3 -m dashsplat.cli list fixtures/sample_teslacam --json
          code=$?
          echo "cli_list_exit_code=$code"
          exit $code
      - name: Doctor + bench (devices + timings)
        shell: bash
        run: |
          export PYTHONPATH="$PWD/python"
          set +e
          python3 -m dashsplat.cli doctor --text | tee doctor.txt
          dcode=${PIPESTATUS[0]}
          echo "doctor_exit_code=$dcode"
          python3 -m dashsplat.cli doctor > doctor.json
          EID=$(python3 -m dashsplat.cli list fixtures/sample_teslacam --json | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['id'])")
          BENCH_OUT="$(mktemp -d "${TMPDIR:-/tmp}/dashsplat-bench.XXXXXX")"
          python3 -m dashsplat.cli bench fixtures/sample_teslacam --event "$EID" --trainer seeded --no-mlx --out "$BENCH_OUT" | tee bench_out.jsonl
          bcode=${PIPESTATUS[0]}
          echo "bench_exit_code=$bcode"
          test -f "$BENCH_OUT/bench.json" && cat "$BENCH_OUT/bench.json"
          if [[ $dcode -ne 0 ]]; then exit $dcode; fi
          exit $bcode
      - name: Upload doctor/bench artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-bench
          path: |
            doctor.txt
            doctor.json
            bench_out.jsonl
          if-no-files-found: warn

  macos-app:
    name: Build unsigned .app
    runs-on: macos-15
    needs: python-tests
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate + build
        run: |
          set +e
          xcodegen generate
          xcodebuild \
            -project DashSplat.xcodeproj \
            -scheme DashSplat \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=- \
            build
          code=$?
          echo "xcodebuild_exit_code=$code"
          exit $code
      - name: Package zip
        run: |
          mkdir -p dist
          APP=$(find build/DerivedData/Build/Products/Release -name 'DashSplat.app' -maxdepth 2 | head -n1)
          cp -R "$APP" dist/DashSplat.app
          rsync -a python/ dist/DashSplat.app/Contents/Resources/python/
          rsync -a viewer/ dist/DashSplat.app/Contents/Resources/
          (cd dist && zip -r DashSplat-unsigned.zip DashSplat.app)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DashSplat-unsigned
          path: dist/DashSplat-unsigned.zip
          if-no-files-found: error

  swift-tests:
    name: Swift tests
    runs-on: macos-15
    needs: python-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prep python (tracked fixtures only — do not overwrite fixtures/)
        run: |
          python3 -m pip install -e "python/[dev]"
          SYNTH_DIR="$(mktemp -d "${TMPDIR:-/tmp}/dashsplat-synth.XXXXXX")"
          python3 python/tools/generate_synthetic_clip.py --out "$SYNTH_DIR"
      - name: XcodeGen + test
        env:
          DASHSPLAT_PYTHON_DIR: ${{ github.workspace }}/python
        run: |
          brew install xcodegen
          xcodegen generate
          set +e
          xcodebuild \
            -project DashSplat.xcodeproj \
            -scheme DashSplat \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test
          code=$?
          echo "xcodebuild_test_exit_code=$code"
          exit $code
