[project]
name = "dashsplat"
version = "0.1.0"
description = "TeslaCam → 3D Gaussian Splat pipeline for Apple Silicon"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
]

[project.optional-dependencies]
# Official facebookresearch/map-anything @ 3d10cf7 (pkg 1.1.4). mlx-vlm has no MapAnything model.
mapanything = [
  "torch>=2.3",
  "huggingface-hub>=0.24",
  "mapanything @ git+https://github.com/facebookresearch/map-anything.git@3d10cf7a3016fc0f9bb13a071ee66c47b10be0d9",
]
mlx = [
  # Legacy optional; MapAnything path no longer uses mlx-vlm.
  "mlx>=0.22",
  "mlx-vlm>=0.7.5",
  "huggingface-hub>=0.24",
]
train = [
  "torch>=2.3",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
dashsplat = "dashsplat.cli:main_folder_argv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dashsplat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
